<div class="container py-5">
  <header class="text-center mb-5">
    <h1 class="display-4 fw-bold text-primary">🐪 Camel Registry</h1>
    <p class="lead text-muted">Manage your camels with ease.</p>
  </header>

  <div class="row g-5">
    <div class="col-lg-4 order-lg-2">
      <app-camel-form [camelToEdit]="selectedCamel" (formSubmitSuccess)="onFormSubmit(camelList)"
        (cancelEdit)="onCancelEdit()"></app-camel-form>
    </div>

    <div class="col-lg-8 order-lg-1">
      <app-camel-list #camelList (editCamel)="onEditCamel($event)"></app-camel-list>
    </div>
  </div>
</div>
