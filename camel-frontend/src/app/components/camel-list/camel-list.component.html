<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Camel Registry</h2>
        <button class="btn btn-outline-secondary btn-sm" (click)="loadCamels()" [disabled]="isLoading()">
            Refresh List
        </button>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
        {{ errorMessage }}
    </div>

    <div *ngIf="isLoading()" class="text-center my-4">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div class="table-responsive" *ngIf="!isLoading() && !errorMessage">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th scope="col">Name</th>
                    <th scope="col">Hump Count</th>
                    <th scope="col" class="text-end">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let camel of camels">
                    <td>{{ camel.name }}</td>
                    <td>
                        <span class="badge bg-info text-dark">{{ camel.humpCount }} Hump{{ camel.humpCount !== 1 ? 's' :
                            '' }}</span>
                    </td>
                    <td class="text-end">
                        <button class="btn btn-primary btn-sm" (click)="onEdit(camel)">
                            <i class="bi bi-pencil"></i> Edit
                        </button>
                    </td>
                </tr>
                <tr *ngIf="camels.length === 0">
                    <td colspan="3" class="text-center py-4 text-muted">
                        No camels found in the registry.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
